{% extends 'base.html' %}

{% block content %}
<h2>{{ titulo }}</h2>
<p>¿Confirmas que deseas eliminar <strong>{{ objeto }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url url_cancelar %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
